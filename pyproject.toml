[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
version = "0.1.0"
description = "Cognitive Off-grid Machine-learning Positioning And Sensor System (SIH 26168 - ISRO)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "COMPASS Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["navigation*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
